    <style>
        :root {
            --bg-dark: #0e0e0e;
            --panel-bg: #1b1b1b;
            --text-main: #eee;
            --accent: #00c896;
            --accent-hover: #00a37a;
            --border: #333;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            text-align: center;
        }

        .logo {
            font-weight: 700;

            color: var(--accent);
            letter-spacing: 0.5px;
        }

            font-weight: 400;

        .controls {
            display: grid;

        .subtitle-preview {
            display: flex;

            gap: 2rem;

        .video-box {
            position: relative;
            background: #000;
            overflow: hidden;

        .video-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
        }

        .subtitle {
            font-family: Arial;
            position: absolute;
            width: 92%;

<body>

<header>
    <div class="logo"><img src="./logo.png" alt="FFmpeg Subtitle Logo" style="max-height: 100px; max-width: 100%;" /></div>
    <div class="logo">FFmpeg Subtitle Style Generator</div>
    <h2>Preview & generate your subtitle styles in real time</h2>
</header>

<div class="controls">
    <label>Text
        <input id="subtitleText" type="text" value="This is a sample subtitle text for testing styles.">
    </label>
    <label>Font size
        <input id="fontSize" type="number" min="8" max="64" value="22">
    </label>
    <label>Text color
        <input id="textColor" type="color" value="#FFFFFF">
    </label>
    <label>Background color
        <input id="bgColor" type="color" value="#000000">
    </label>
    <label>Background opacity
        <input id="bgOpacity" type="range" min="0" max="1" step="0.05" value="0.9">
    </label>
    <label>Bold
        <input id="bold" type="checkbox" checked>
    </label>
    <label>Italic
        <input id="italic" type="checkbox">
    </label>
    <label>Outline (stroke)
        <input id="outline" type="range" min="0" max="10" value="3">
    </label>
    <label>Shadow
        <input id="shadow" type="range" min="0" max="10" value="2">
    </label>
    <label>Alignment
        <select id="alignment">
            <option value="1">Bottom Left</option>
            <option value="2" selected>Bottom Center</option>
            <option value="3">Bottom Right</option>
            <option value="5">Middle Left</option>
            <option value="6">Middle Center</option>
            <option value="7">Top Left</option>
            <option value="8">Top Center</option>
            <option value="9">Top Right</option>
        </select>
    </label>
    <label>Padding (vertical)
        <input id="padding" type="range" min="0" max="30" value="10">
    </label>
    <label>MarginV
        <input id="marginV" type="range" min="0" max="200" value="80">
    </label>
    <label>Border radius
        <input id="radius" type="range" min="0" max="10" value="2">
    </label>
</div>

<div class="subtitle-preview">
    <div class="video-box" style="width:270px; height:480px;">
        <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&h=700&fit=crop" alt="portrait preview">
        <div class="subtitle" id="subtitlePortrait"></div>
    </div>
    <div class="video-box" style="width:480px; height:270px;">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&h=450&fit=crop" alt="landscape preview">
        <div class="subtitle" id="subtitleLandscape"></div>
    </div>
</div>

<div class="actions">
    <button class="btn" id="copyFFmpeg">📋 Copy FFmpeg Command</button>
    <button class="btn" id="downloadConfig">⬇️ Download Config</button>
</div>

<pre id="ffmpegOutput"></pre>

<footer>© 2025 FFmpeg Subtitle Style Generator | Free online subtitle visualizer & checker</footer>

<script>
const els = {
    text: document.getElementById('subtitleText'),
    fontSize: document.getElementById('fontSize'),
    textColor: document.getElementById('textColor'),
    bgColor: document.getElementById('bgColor'),
    bgOpacity: document.getElementById('bgOpacity'),
    bold: document.getElementById('bold'),
    italic: document.getElementById('italic'),
    padding: document.getElementById('padding'),
    marginV: document.getElementById('marginV'),
    radius: document.getElementById('radius'),
    outline: document.getElementById('outline'),
    shadow: document.getElementById('shadow'),
    alignment: document.getElementById('alignment')
};

const portraitSubtitle = document.getElementById('subtitlePortrait');
const landscapeSubtitle = document.getElementById('subtitleLandscape');
const ffmpegOutput = document.getElementById('ffmpegOutput');
const copyBtn = document.getElementById('copyFFmpeg');
const downloadBtn = document.getElementById('downloadConfig');

function rgbToAss(hex) {
    const bigint = parseInt(hex.replace('#', ''), 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return `${b.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${r.toString(16).padStart(2, '0')}`.toUpperCase();
}

function updateSubtitles() {
    const bgRGBA = hexToRgba(els.bgColor.value, parseFloat(els.bgOpacity.value));
    const style = {
        color: els.textColor.value,
        backgroundColor: bgRGBA,
        fontSize: els.fontSize.value + 'px',
        fontWeight: els.bold.checked ? 'bold' : 'normal',
        fontStyle: els.italic.checked ? 'italic' : 'normal',
        padding: els.padding.value + 'px',
        bottom: els.marginV.value + 'px',
        borderRadius: els.radius.value + 'px',
        textAlign: 'center',
        textShadow: `0px ${els.shadow.value}px ${els.shadow.value * 1.2}px rgba(0,0,0,0.8)`,
        WebkitTextStroke: `${els.outline.value / 2}px black`
    };

    portraitSubtitle.textContent = els.text.value;
    landscapeSubtitle.textContent = els.text.value;

    [portraitSubtitle, landscapeSubtitle].forEach(el => {
        Object.assign(el.style, style);
        el.style.top = '';
        el.style.transform = 'translateX(-50%)';

        switch (parseInt(els.alignment.value)) {
            case 1: el.style.bottom = els.marginV.value + 'px'; el.style.textAlign = 'left'; break;
            case 2: el.style.bottom = els.marginV.value + 'px'; el.style.textAlign = 'center'; break;
            case 3: el.style.bottom = els.marginV.value + 'px'; el.style.textAlign = 'right'; break;
            case 5: el.style.top = '50%'; el.style.transform = 'translate(-50%, -50%)'; el.style.textAlign = 'left'; break;
            case 6: el.style.top = '50%'; el.style.transform = 'translate(-50%, -50%)'; el.style.textAlign = 'center'; break;
            case 7: el.style.top = '20px'; el.style.textAlign = 'left'; break;
            case 8: el.style.top = '20px'; el.style.textAlign = 'center'; break;
            case 9: el.style.top = '20px'; el.style.textAlign = 'right'; break;
        }
    });

    generateFFmpegStyle();
}

function generateFFmpegStyle() {
    const textColor = rgbToAss(els.textColor.value);
    const bgColor = rgbToAss(els.bgColor.value);
    const opacityHex = Math.round(els.bgOpacity.value * 255).toString(16).padStart(2, '0').toUpperCase();

    const style = [
        "FontName=Arial Bold",
        `FontSize=${els.fontSize.value}`,
        `PrimaryColour=&H${textColor}&`,
        `OutlineColour=&H${bgColor}&`,
        `BackColour=&H${opacityHex}${bgColor}&`,
        `Bold=${els.bold.checked ? 1 : 0}`,
        `Italic=${els.italic.checked ? 1 : 0}`,
        `BorderStyle=3`,
        `Outline=${els.outline.value}`,
        `Shadow=${els.shadow.value}`,
        `MarginV=${els.marginV.value}`,
        `Alignment=${els.alignment.value}`
    ].join(',');

    ffmpegOutput.textContent = `ffmpeg -i input.mp4 -vf "subtitles='YOUR_SUBS_FILE.srt':force_style='${style}'" -c:a copy output.mp4`;
}

function hexToRgba(hex, opacity) {
    const bigint = parseInt(hex.replace('#', ''), 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return `rgba(${r},${g},${b},${opacity})`;
}

copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(ffmpegOutput.textContent);
    copyBtn.textContent = "✅ Copied!";
    setTimeout(() => copyBtn.textContent = "📋 Copy FFmpeg Command", 2000);
});

downloadBtn.addEventListener('click', () => {
    const blob = new Blob([ffmpegOutput.textContent], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "ffmpeg_subtitle_style.txt";
    link.click();
});

Object.values(els).forEach(el => el.addEventListener('input', updateSubtitles));
updateSubtitles();
</script>
</body>
